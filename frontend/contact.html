<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Abin Thomas</title>
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="particles-js"></div>
    <nav class="glass-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="socials.html">Socials</a></li>
            <li><a href="certifications.html">Certifications</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="contact-section glass-panel">
            <h1 class="gradient-text text-center">Get In Touch</h1>
            <p class="subtitle text-center">Have some feedback or want to connect? Send me a message!</p>
            
            <form id="feedback-form" class="feedback-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                </div>
                
                <div class="form-group">
                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="5" required placeholder="Your message here..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span>Send Message</span>
                    <div class="loader" id="loader"></div>
                </button>
                
                <div id="form-message" class="form-message"></div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="contact.js"></script>
</body>
</html>
